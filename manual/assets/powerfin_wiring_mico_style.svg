<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="3300" viewBox="0 0 2400 3300">
<defs><style>.title{font-family:'DejaVu Sans';font-size:110px;font-weight:bold}.head{font-family:'DejaVu Sans';font-size:64px;font-weight:bold}.txt{font-family:'DejaVu Sans';font-size:43px}.module{fill:#f5f7f6;stroke:#111;stroke-width:10;rx:30}.wire{fill:none;stroke-width:18;stroke-linecap:round}.red,.black,.green,.yellow,.blue,.purple,.teal{fill:none;stroke-width:18;stroke-linecap:round}.red{stroke:#e52c2c}.black{stroke:#171717}.green{stroke:#55a443}.yellow{stroke:#e4b52e}.blue{stroke:#438bd2}.purple{stroke:#8856b5}.teal{stroke:#18a0a0}.tag{font-family:'DejaVu Sans';font-size:34px;font-weight:bold;fill:white;text-anchor:middle}</style></defs>
<rect width="2400" height="3300" fill="white"/><text class="title" x="1200" y="130" text-anchor="middle">PowerFin Wiring Diagram</text>

<!-- battery, motors and ESC -->
<rect class="module" x="700" y="230" width="1000" height="430"/><text class="head" x="1200" y="310" text-anchor="middle">4-in-1 ESC</text>
<circle cx="820" cy="450" r="95" fill="#e8edf0" stroke="#111" stroke-width="8"/><circle cx="1050" cy="450" r="95" fill="#e8edf0" stroke="#111" stroke-width="8"/><circle cx="1350" cy="450" r="95" fill="#e8edf0" stroke="#111" stroke-width="8"/><circle cx="1580" cy="450" r="95" fill="#e8edf0" stroke="#111" stroke-width="8"/>
<text class="txt" x="1200" y="610" text-anchor="middle">VBAT · GND · CURR · NC · M1 · M2 · M3 · M4</text>
<rect class="module" x="60" y="300" width="430" height="280"/><text class="head" x="275" y="385" text-anchor="middle">Li-Po</text><text class="txt" x="275" y="455" text-anchor="middle">Battery</text><text class="txt" x="275" y="525" text-anchor="middle">Voltage per ESC spec</text><path style="fill:none;stroke:#e52c2c;stroke-width:18;stroke-linecap:round" d="M490 380H700"/><path style="fill:none;stroke:#171717;stroke-width:18;stroke-linecap:round" d="M490 500H700"/>

<!-- board -->
<image xlink:href="manual/powerfin_top.png" x="760" y="900" width="880" height="892"/>
<!-- ESC bundle -->
<path style="fill:none;stroke:#8856b5;stroke-width:18;stroke-linecap:round" d="M900 660V805L810 1110"/><path style="fill:none;stroke:#18a0a0;stroke-width:18;stroke-linecap:round" d="M980 660V820L835 1110"/><path style="fill:none;stroke:#438bd2;stroke-width:18;stroke-linecap:round" d="M1060 660V835L860 1110"/><path style="fill:none;stroke:#e4b52e;stroke-width:18;stroke-linecap:round" d="M1140 660V850L885 1110"/><path style="fill:none;stroke:#e52c2c;stroke-width:18;stroke-linecap:round" d="M1220 660V790L910 1110"/><path style="fill:none;stroke:#171717;stroke-width:18;stroke-linecap:round" d="M1300 660V780L935 1110"/>
<g><rect x="785" y="760" width="95" height="55" fill="#8856b5"/><text class="tag" x="832" y="800">M1</text><rect x="885" y="760" width="95" height="55" fill="#18a0a0"/><text class="tag" x="932" y="800">M2</text><rect x="985" y="760" width="95" height="55" fill="#438bd2"/><text class="tag" x="1032" y="800">M3</text><rect x="1085" y="760" width="95" height="55" fill="#e4b52e"/><text class="tag" x="1132" y="800">M4</text></g>

<!-- GPS compass -->
<rect class="module" x="70" y="2120" width="650" height="520"/><circle cx="395" cy="2320" r="120" fill="#2f4a65"/><path d="M395 2210L435 2370L395 2340L355 2370Z" fill="white"/><text class="head" x="395" y="2520" text-anchor="middle">GPS + Compass</text><text class="txt" x="395" y="2585" text-anchor="middle">UART1 + I2C1</text>
<path style="fill:none;stroke:#e52c2c;stroke-width:18;stroke-linecap:round" d="M720 2220H850L980 1790"/><path style="fill:none;stroke:#171717;stroke-width:18;stroke-linecap:round" d="M720 2280H875L1010 1790"/><path style="fill:none;stroke:#55a443;stroke-width:18;stroke-linecap:round" d="M720 2340H900L1040 1790"/><path style="fill:none;stroke:#e4b52e;stroke-width:18;stroke-linecap:round" d="M720 2400H925L1070 1790"/><path style="fill:none;stroke:#8856b5;stroke-width:18;stroke-linecap:round" d="M720 2460H950L1100 1790"/><path style="fill:none;stroke:#438bd2;stroke-width:18;stroke-linecap:round" d="M720 2520H975L1130 1790"/>
<text class="txt" x="735" y="2195">5V</text><text class="txt" x="735" y="2260">GND</text><text class="txt" x="735" y="2325">TX→RX</text><text class="txt" x="735" y="2390">RX←TX</text><text class="txt" x="735" y="2455">SCL</text><text class="txt" x="735" y="2515">SDA</text>

<!-- RC -->
<rect class="module" x="875" y="2260" width="650" height="380"/><path d="M1040 2380H1360M1080 2430H1320M1120 2480H1280" stroke="#111" stroke-width="16"/><text class="head" x="1200" y="2570" text-anchor="middle">RC Receiver</text><text class="txt" x="1200" y="2625" text-anchor="middle">UART3 · /dev/ttyS3</text>
<path style="fill:none;stroke:#e52c2c;stroke-width:18;stroke-linecap:round" d="M1080 2260V2050L1300 1790"/><path style="fill:none;stroke:#171717;stroke-width:18;stroke-linecap:round" d="M1200 2260V2050L1330 1790"/><path style="fill:none;stroke:#55a443;stroke-width:18;stroke-linecap:round" d="M1320 2260V2050L1360 1790"/><text class="txt" x="1020" y="2180">5V</text><text class="txt" x="1150" y="2180">GND</text><text class="txt" x="1280" y="2180">TX→RX</text>

<!-- CAN -->
<rect class="module" x="1680" y="2120" width="650" height="520"/><circle cx="2005" cy="2320" r="115" fill="#dce5df" stroke="#111" stroke-width="8"/><text class="head" x="2005" y="2530" text-anchor="middle">CAN Device</text><text class="txt" x="2005" y="2590" text-anchor="middle">5V · GND · CANL · CANH</text>
<path style="fill:none;stroke:#e52c2c;stroke-width:18;stroke-linecap:round" d="M1680 2220H1550L1450 1790"/><path style="fill:none;stroke:#171717;stroke-width:18;stroke-linecap:round" d="M1680 2300H1525L1420 1790"/><path style="fill:none;stroke:#55a443;stroke-width:18;stroke-linecap:round" d="M1680 2380H1500L1390 1790"/><path style="fill:none;stroke:#e4b52e;stroke-width:18;stroke-linecap:round" d="M1680 2460H1475L1360 1790"/>

<!-- USB PC -->
<rect class="module" x="630" y="2870" width="1140" height="280"/><rect x="740" y="2940" width="340" height="170" fill="#dfe8ed" stroke="#111" stroke-width="8"/><text class="head" x="910" y="3045" text-anchor="middle">PC</text><path style="fill:none;stroke:#438bd2;stroke-width:18;stroke-linecap:round" d="M1080 3025H1510V1850L1510 1750"/><text class="head" x="1430" y="2995" text-anchor="middle">USB-C / RNDIS</text><text class="txt" x="1430" y="3060" text-anchor="middle">192.168.123.100:8080</text>
<text class="txt" x="1200" y="3250" text-anchor="middle">Wire colors identify signals only. Verify connector orientation before power-on.</text>
</svg>
