<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="4200" height="4300" viewBox="0 0 4200 4300">
<defs><style>.title{font-family:'DejaVu Sans';font-size:120px;font-weight:bold}.port{fill:white;stroke:#111;stroke-width:10}.head{font-family:'DejaVu Sans';font-size:72px;font-weight:bold}.pin{font-family:'DejaVu Sans';font-size:74px;font-weight:bold;text-anchor:middle}.sig{fill:#3970a8}.pwr{fill:#d52b2b}.gnd{fill:#111}.dash{fill:none;stroke:#3970a8;stroke-width:14;stroke-dasharray:28 22}.dim{fill:none;stroke:#e32636;stroke-width:24}.dim-ext{fill:none;stroke:#e32636;stroke-width:14;stroke-dasharray:28 18}.dim-text{font-family:'DejaVu Sans';font-size:105px;font-weight:bold;fill:#b31322;text-anchor:middle}</style></defs>
