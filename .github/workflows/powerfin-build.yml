name: PowerFin build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read

concurrency:
  group: powerfin-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      FORCE_UNSAFE_CONFIGURE: "1"

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          docker system prune --all --force || true
          df -h /

      - name: Install host dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            device-tree-compiler \
            dosfstools \
            expect \
            fakeroot \
            file \
            flex \
            git-lfs \
            jq \
            libgmp-dev \
            libmpc-dev \
            libncurses-dev \
            libsqlite3-dev \
            libssl-dev \
            lz4 \
            mtools \
            ninja-build \
            parted \
            python3 \
            python3-pip \
            python-is-python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd
          git lfs install

      - name: Install Python 2 for U-Boot
        shell: bash
        run: |
          curl --fail --location \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz \
            --output "${RUNNER_TEMP}/Python-2.7.18.tgz"
          tar -C "${RUNNER_TEMP}" -xf "${RUNNER_TEMP}/Python-2.7.18.tgz"
          cd "${RUNNER_TEMP}/Python-2.7.18"
          ./configure \
            --prefix="${RUNNER_TEMP}/python2" \
            --without-ensurepip
          make --jobs="$(nproc)"
          make install
          echo "${RUNNER_TEMP}/python2/bin" >> "${GITHUB_PATH}"

      - name: Install repo
        shell: bash
        run: |
          install -d "${HOME}/.local/bin"
          curl --fail --location \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "${HOME}/.local/bin/repo"
          chmod +x "${HOME}/.local/bin/repo"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Check out SDK root
        uses: actions/checkout@v4
        with:
          lfs: true
          path: sdk

      - name: Sync SDK component repositories
        working-directory: sdk
        shell: bash
        run: |
          repo init \
            --manifest-url=https://github.com/HumpbackLab/manifest.git \
            --manifest-branch=master \
            --manifest-name=powerfin.xml \
            --depth=1
          repo sync --current-branch --jobs=4 --fail-fast --no-tags
          repo manifest -r -o "${RUNNER_TEMP}/powerfin-resolved.xml"
          if grep -q '192\.168\.10\.75' "${RUNNER_TEMP}/powerfin-resolved.xml"; then
            echo "::error::Resolved manifest still contains the vendor intranet remote."
            exit 1
          fi

      - name: Build complete PowerFin image
        working-directory: sdk
        shell: bash
        run: |
          ./build.sh rk3506:powerfin_buildroot_spinor_defconfig
          ./build.sh bmake:busybox-source
          ./build.sh all

      - name: Verify images
        working-directory: sdk
        shell: bash
        run: |
          test -s kernel-6.1/zboot.img
          test -s output/firmware/update.img
          test -s buildroot/output/rockchip_powerfin/images/powerfin-sdcard.img
          test -s buildroot/output/rockchip_powerfin/images/powerfin-sdcard.img.gz
          install -d release
          install -m 0644 \
            kernel-6.1/zboot.img \
            release/zboot.img
          install -m 0644 \
            output/firmware/update.img \
            release/update.img
          install -m 0644 \
            buildroot/output/rockchip_powerfin/images/powerfin-sdcard.img.gz \
            release/powerfin-sdcard.img.gz
          (
            cd release
            sha256sum powerfin-sdcard.img.gz update.img zboot.img > SHA256SUMS
          )

      - name: Upload PowerFin images
        uses: actions/upload-artifact@v4
        with:
          name: powerfin-images-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            sdk/release/powerfin-sdcard.img.gz
            sdk/release/update.img
            sdk/release/zboot.img
            sdk/release/SHA256SUMS

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: powerfin-build-logs-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            sdk/output/sessions/
            sdk/buildroot/output/rockchip_powerfin/build/build-time.log
