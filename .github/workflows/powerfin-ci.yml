name: PowerFin release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: powerfin-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      release_title: ${{ steps.release.outputs.title }}
      release_tag: ${{ steps.release.outputs.tag }}
      triggered_at: ${{ steps.release.outputs.triggered_at }}

    env:
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}

    steps:
      - name: Check Gitee release token
        shell: bash
        run: |
          if [[ -z "${GITEE_ACCESS_TOKEN}" ]]; then
            echo "::error::Add a GITEE_ACCESS_TOKEN repository secret with write access to ncer/powerfin_sdk."
            exit 1
          fi

      - name: Resolve release timestamp
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          triggered_at="$(jq --exit-status --raw-output '.created_at' <<<"${run_json}")"
          release_title="$(TZ=Asia/Shanghai date --date="${triggered_at}" '+%Y-%m-%d %H:%M:%S')"
          release_stamp="$(TZ=Asia/Shanghai date --date="${triggered_at}" '+%Y%m%d-%H%M%S')"
          {
            echo "title=${release_title}"
            echo "tag=powerfin-${release_stamp}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "triggered_at=${triggered_at}"
          } >> "${GITHUB_OUTPUT}"

  build-components:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        component:
          - buildroot
          - firmware

    env:
      FORCE_UNSAFE_CONFIGURE: "1"

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          docker system prune --all --force || true
          df -h /

      - name: Install host dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            device-tree-compiler \
            dosfstools \
            e2fsprogs \
            expect \
            fakeroot \
            file \
            flex \
            git-lfs \
            jq \
            libgmp-dev \
            libmpc-dev \
            libncurses-dev \
            libsqlite3-dev \
            libssl-dev \
            lz4 \
            mtools \
            ninja-build \
            parted \
            python3 \
            python3-pip \
            python-is-python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd
          git lfs install

      - name: Install Python 2 for U-Boot
        if: matrix.component == 'firmware'
        shell: bash
        run: |
          curl --fail --location \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz \
            --output "${RUNNER_TEMP}/Python-2.7.18.tgz"
          tar -C "${RUNNER_TEMP}" -xf "${RUNNER_TEMP}/Python-2.7.18.tgz"
          cd "${RUNNER_TEMP}/Python-2.7.18"
          ./configure \
            --prefix="${RUNNER_TEMP}/python2" \
            --without-ensurepip
          make --jobs="$(nproc)"
          make install
          echo "${RUNNER_TEMP}/python2/bin" >> "${GITHUB_PATH}"

      - name: Install repo
        shell: bash
        run: |
          install -d "${HOME}/.local/bin"
          curl --fail --location \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "${HOME}/.local/bin/repo"
          chmod +x "${HOME}/.local/bin/repo"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Check out SDK root
        uses: actions/checkout@v4
        with:
          lfs: true
          path: sdk

      - name: Sync SDK component repositories
        working-directory: sdk
        shell: bash
        run: |
          repo init \
            --manifest-url=https://github.com/HumpbackLab/manifest.git \
            --manifest-branch=master \
            --manifest-name=powerfin.xml \
            --depth=1
          repo sync --current-branch --jobs=4 --fail-fast --no-tags
          repo manifest -r -o "${RUNNER_TEMP}/powerfin-resolved.xml"
          if grep -q '192\.168\.10\.75' "${RUNNER_TEMP}/powerfin-resolved.xml"; then
            echo "::error::Resolved manifest still contains the vendor intranet remote."
            exit 1
          fi

      - name: Select PowerFin configuration
        working-directory: sdk
        shell: bash
        run: ./build.sh rk3506:powerfin_buildroot_spinor_defconfig

      - name: Fetch BusyBox source for ramboot packaging
        working-directory: sdk
        shell: bash
        run: ./build.sh bmake:busybox-source

      - name: Build ${{ matrix.component }}
        working-directory: sdk
        shell: bash
        run: |
          case "${{ matrix.component }}" in
            buildroot)
              ./build.sh buildroot
              ;;
            firmware)
              ./build.sh loader
              ./build.sh kernel
              ./build.sh firmware
              ;;
          esac

      - name: Verify ${{ matrix.component }} outputs
        working-directory: sdk
        shell: bash
        run: |
          install -d release-component
          case "${{ matrix.component }}" in
            buildroot)
              test -r output/buildroot/target/etc/powerfin-release
              test -s buildroot/output/rockchip_powerfin/images/powerfin-sdcard.img
              test -s buildroot/output/rockchip_powerfin/images/powerfin-sdcard.img.gz
              debugfs -R 'stat /etc/powerfin-release' \
                buildroot/output/rockchip_powerfin/images/rootfs.ext2 2>&1 | \
                grep -q 'Type: regular'
              install -m 0644 \
                buildroot/output/rockchip_powerfin/images/powerfin-sdcard.img.gz \
                release-component/powerfin-sdcard.img.gz
              ;;
            firmware)
              test -s kernel-6.1/zboot.img
              test -s output/firmware/update.img
              install -m 0644 kernel-6.1/zboot.img release-component/zboot.img
              install -m 0644 output/firmware/update.img release-component/update.img
              ;;
          esac

      - name: Upload ${{ matrix.component }} outputs
        uses: actions/upload-artifact@v4
        with:
          name: powerfin-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: sdk/release-component/

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: powerfin-${{ matrix.component }}-logs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            sdk/output/sessions/
            sdk/buildroot/output/rockchip_powerfin/build/build-time.log

  release:
    needs:
      - preflight
      - build-components
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      GITEE_RELEASE_TITLE: ${{ needs.preflight.outputs.release_title }}
      GITEE_RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      GITHUB_TRIGGERED_AT: ${{ needs.preflight.outputs.triggered_at }}

    steps:
      - name: Check out release scripts
        uses: actions/checkout@v4
        with:
          lfs: false
          path: sdk

      - name: Download Buildroot image
        uses: actions/download-artifact@v4
        with:
          name: powerfin-buildroot-${{ github.run_id }}-${{ github.run_attempt }}
          path: sdk/release

      - name: Download firmware images
        uses: actions/download-artifact@v4
        with:
          name: powerfin-firmware-${{ github.run_id }}-${{ github.run_attempt }}
          path: sdk/release

      - name: Verify release images
        working-directory: sdk
        shell: bash
        run: |
          test -s release/powerfin-sdcard.img.gz
          test -s release/update.img
          test -s release/zboot.img
          (
            cd release
            sha256sum powerfin-sdcard.img.gz update.img zboot.img > SHA256SUMS
          )

      - name: Upload PowerFin images
        uses: actions/upload-artifact@v4
        with:
          name: powerfin-images-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            sdk/release/powerfin-sdcard.img.gz
            sdk/release/update.img
            sdk/release/zboot.img
            sdk/release/SHA256SUMS

      - name: Publish Gitee release
        working-directory: sdk
        shell: bash
        env:
          GITEE_OWNER: ncer
          GITEE_REPO: powerfin_sdk
        run: .github/scripts/publish-gitee-release.sh release
