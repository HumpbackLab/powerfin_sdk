name: PowerFin release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: powerfin-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}

    steps:
      - name: Check Gitee release token
        shell: bash
        run: |
          if [[ -z "${GITEE_ACCESS_TOKEN}" ]]; then
            echo "::error::Add a GITEE_ACCESS_TOKEN repository secret with write access to ncer/powerfin_sdk."
            exit 1
          fi

  build:
    needs: preflight
    uses: ./.github/workflows/powerfin-build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}

    steps:
      - name: Resolve release timestamp
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          triggered_at="$(jq --exit-status --raw-output '.created_at' <<<"${run_json}")"
          release_title="$(TZ=Asia/Shanghai date --date="${triggered_at}" '+%Y-%m-%d %H:%M:%S')"
          release_stamp="$(TZ=Asia/Shanghai date --date="${triggered_at}" '+%Y%m%d-%H%M%S')"
          {
            echo "GITEE_RELEASE_TITLE=${release_title}"
            echo "GITEE_RELEASE_TAG=powerfin-${release_stamp}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "GITHUB_TRIGGERED_AT=${triggered_at}"
          } >> "${GITHUB_ENV}"

      - name: Check out release script
        uses: actions/checkout@v4
        with:
          path: sdk
          sparse-checkout: .github/scripts/publish-gitee-release.sh
          sparse-checkout-cone-mode: false

      - name: Download PowerFin images
        uses: actions/download-artifact@v4
        with:
          name: powerfin-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: sdk/release

      - name: Publish Gitee release
        working-directory: sdk
        shell: bash
        env:
          GITEE_OWNER: ncer
          GITEE_REPO: powerfin_sdk
        run: .github/scripts/publish-gitee-release.sh release
